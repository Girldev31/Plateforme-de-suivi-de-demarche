<div class="agent-layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="logo.png" alt="SénégalAdmin" class="brand-logo">
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/agent/demandes" routerLinkActive="active" class="nav-item">
        <span class="material-icons">inbox</span>
        File d'attente
      </a>
      <a routerLink="/agent/historique" routerLinkActive="active" class="nav-item">
        <span class="material-icons">history</span>
        Historique
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a class="nav-item">
        <span class="material-icons">headset_mic</span>
        Support
      </a>
      <a routerLink="/login" class="nav-item logout">
        <span class="material-icons">logout</span>
        Déconnexion
      </a>
    </div>
  </aside>

  <div class="main-content">

    <header class="topbar">
      <div class="topbar-left">
        <h2 class="topbar-title">
          Espace Agent
          <span>SÉNÉGALADMIN</span>
        </h2>
      </div>
      <div class="topbar-right">
        <div class="notif-wrapper">
          <button class="notif-btn" (click)="toggleNotifs()">
            <span class="material-icons">notifications</span>
            <span class="notif-badge" *ngIf="notifCount > 0">{{ notifCount }}</span>
          </button>
          <div class="notif-dropdown" *ngIf="showNotifs">
            <div class="notif-header">
              <h4>Nouvelles demandes</h4>
            </div>
            <div class="notif-item" *ngFor="let d of messages">
              <span class="material-icons">assignment</span>
              <div>
                <p>{{ d.type_demande?.libelle }}</p>
                <span>{{ d.citoyen?.user?.name }} — {{ d.date_soumission | date:'dd/MM/yyyy' }}</span>
              </div>
            </div>
            <div *ngIf="messages.length === 0" class="notif-empty">
              Aucune nouvelle demande
            </div>
          </div>
        </div>
        <div class="user-avatar">A</div>
      </div>
    </header>

    <div class="page-content">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>
