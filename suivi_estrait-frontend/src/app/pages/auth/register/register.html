<div class="auth-page">
  <div class="auth-left">
    <div class="auth-logo">
       <img src="assets/images/logo.png" alt="SénégalAdmin" class="logo-img" routerLink="/accueil">
    </div>
    <div class="auth-branding">
      <h1>Bienvenue sur<br><span class="highlight">TÉRANGA</span></h1>
      <p>Gérez vos documents administratifs sénégalais depuis n'importe où dans le monde en toute sécurité.</p>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-form-container">
      <h2>Créer un compte</h2>
      <p class="form-subtitle">Rejoignez la plateforme de la diaspora sénégalaise.</p>

      <div class="forms-grid">
        <div class="form-group">
          <label>Nom complet</label>
          <input type="text" [(ngModel)]="name" placeholder="Votre nom complet">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" placeholder="votre-adresse@email.com">
        </div>

        <div class="form-group">
          <label>Téléphone</label>
          <input type="tel" [(ngModel)]="phone" placeholder="+33 6 00 00 00 00">
        </div>

        <div class="form-group">
          <label>Pays de résidence</label>
          <input type="text" [(ngModel)]="country" placeholder="France, USA, Canada...">
        </div>

        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" [(ngModel)]="password" placeholder="••••••••">
        </div>

        <div class="form-group">
          <label>Confirmer le mot de passe</label>
          <input type="password" [(ngModel)]="confirmPassword" placeholder="••••••••">
        </div>
      </div>

      <button class="btn-submit">Créer mon compte</button>

      <p class="form-footer">
        Déjà un compte ?
        <a routerLink="/login" class="link-switch">Se connecter</a>
      </p>
    </div>
  </div>
</div>
